
<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Gujarati New Year 🪔</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <canvas id="fireworks"></canvas>

    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="spark s1"></div>
    <div class="spark s2"></div>
    <div class="spark s3"></div>
    <div class="spark s4"></div>

    <div class="container">

        <div class="lamp">🪔</div>

        <h1>સાલ મુબારક!</h1>

        <div class="gujarati">
            નવા વર્ષની હાર્દિક શુભકામનાઓ!
        </div>

        <div class="divider"></div>

        <p class="subtitle">
            Happy New Year! 🎉<br>
            May this New Year bring happiness, success,
            good health and prosperity to you and your family.
        </p>

        <input
            type="text"
            id="name"
            placeholder="Enter Your Name ✨"
        >

        <div id="greeting">
            Wishing you a beautiful new beginning! 💛
        </div>

        <button id="celebrateBtn">
            🎆 Celebrate Bestu Varas 🎉
        </button>

    </div>

    <footer>
        Made with ❤️ for New Year | સાલ મુબારક!
    </footer>

    <script src="script.js"></script>

</body>
</html>
